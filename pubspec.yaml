name: doselens
description: "AI-Powered Medication Scanner & Adherence Passport"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Backend & Database (Firebase)
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.4
  firebase_storage: ^12.4.3

  # AI & Networking
  dio: ^5.7.0
  flutter_dotenv: ^5.2.1

  # Hardware & Scanner
  camera: ^0.11.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Notifications & PDF
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4

  # UI / Design System Tokens
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - .env
