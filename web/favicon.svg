<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="capsule-top">
      <rect x="0" y="0" width="100" height="50" />
    </clipPath>
  </defs>
  <g transform="rotate(-35 50 50)">
    <!-- Capsule Outer Container -->
    <rect x="28" y="8" width="44" height="84" rx="22" ry="22" fill="#ffffff" stroke="#333333" stroke-width="5" />
    
    <!-- Top Solid Dose Fill -->
    <g clip-path="url(#capsule-top)">
      <rect x="28" y="8" width="44" height="84" rx="22" ry="22" fill="#333333" />
    </g>
    
    <!-- Waist Divider -->
    <line x1="28" y1="50" x2="72" y2="50" stroke="#333333" stroke-width="4" />
    
    <!-- Bottom Iris Aperture Center -->
    <circle cx="50" cy="70" r="16" fill="#ffffff" />
    
    <!-- Aperture Blades -->
    <g fill="#333333" stroke="#ffffff" stroke-width="1.2">
      <!-- 6 Blades -->
      <polygon points="50,55 63,62 55,68" />
      <polygon points="63,62 65,76 56,73" />
      <polygon points="65,76 54,85 49,76" />
      <polygon points="54,85 40,80 46,72" />
      <polygon points="40,80 37,65 47,68" />
      <polygon points="37,65 50,55 52,65" />
    </g>
    
    <!-- Center AI Optical Focus Sensor (Cobalt Signal) -->
    <circle cx="50" cy="70" r="5.5" fill="#2C70DD" />
    <!-- Glint -->
    <circle cx="48.5" cy="68.5" r="1.5" fill="#ffffff" />
  </g>
</svg>
